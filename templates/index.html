<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer & Translator</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* BODY - calm pleasant gradient */
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff, #f1f5f9, #e0f2fe);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e5e7eb;
            padding: 20px;
        }

        /* Container */
        .container {
            width: 520px;
            max-width: 90%;
            padding: 30px;
            border-radius: 18px;
            background: white !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: 0.3s;
        }

        .container:hover {
            transform: translateY(-4px);
        }

        /* Headings */
        .container h1 {
            font-size: 28px;
            letter-spacing: 1px;
            color: #1e293b;
        }

        .container h3 {
            margin: 10px 0;
            color: #475569;
            font-weight: 400;
        }

        .container p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* Textarea */
        #dialogue-input {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.7);
            color: #1e293b;
            border: 1px solid rgba(0, 0, 0, 0.1);
            outline: none;
            resize: none;
            transition: 0.3s;
        }

        #dialogue-input::placeholder {
            color: #94a3b8;
        }

        #dialogue-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        /* Buttons */
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #00f5ff, #8a2be2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            box-shadow: 0 0 20px #00f5ff, 0 0 40px #8a2be2;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        button::after {
            content: "";
            position: absolute;
            width: 0;
            height: 300%;
            top: 50%;
            left: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%) rotate(45deg);
            transition: 0.5s;
        }

        button:hover::after {
            width: 120%;
        }

        /* Output Cards (Hidden by default, displayed via JS) */
        .summary-output{
            display: none; 
            margin-top: 25px;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            text-align: left;
            position: relative;
            transition: 0.25s ease;
        }

        .summary-output:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        /* Pseudo-borders */
        .summary-output::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 14px;
            padding: 1px;
            background: linear-gradient(90deg, #00f5ff, #8a2be2);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.4;
            pointer-events: none;
        }
        
        #summary-heading {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #summary-heading::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(90deg, #00f5ff, #8a2be2);
        }

        #summary-text {
            color: #475569;
            font-size: 14px;
            line-height: 1.7;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Text Summarizer</h1>
        <h3>Using Hugging Face Transformer</h3>
        <p>Write or Paste your content for quick summarization & translation</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content here..." required></textarea>
            <button type="submit" id="summarize-btn">Summarize</button>
        </form>

        <div class="summary-output" id="summary-card">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        const dialogueInput = document.getElementById("dialogue-input");
        const summaryText = document.getElementById("summary-text");
        const summaryCard = document.getElementById("summary-card");
        const summarizeBtn = document.getElementById("summarize-btn");

        const translateBtn = document.getElementById("translate-btn");
        const hindiText = document.getElementById("hindi-text");
        const hindiCard = document.getElementById("hindi-card");

        // --- SUMMARIZATION LOGIC ---
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;

            summaryCard.style.display = "block";
            summaryText.innerText = "Processing summary...";
            summarizeBtn.disabled = true;

            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue })
                });

                if (!response.ok) throw new Error(`Server Error: ${response.status}`);

                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                summarizeBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
